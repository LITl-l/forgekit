[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgekit"
version = "0.0.1"
description = "Research-incubator pipeline for local LLM development: data -> fine-tune -> compress -> eval -> serve."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "forgekit contributors" }]
keywords = ["llm", "fine-tuning", "quantization", "lora", "qlora", "gguf", "vllm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.scripts]
forgekit = "forgekit.cli:app"

[project.optional-dependencies]
# Every extra below installs something. An earlier revision left ten of them as
# empty lists ("intentionally empty in the scaffold PR"), so `--extra awq`
# silently installed nothing while `doctor` reported the backend missing
# forever. The shared ML pins were also two major versions stale — `<5` on
# transformers and `<0.12` on trl excluded every current release — which made
# the extras that *were* populated resolve to a 2024-era stack.
#
# Shared runtime for anything that touches a HF model.
hf = [
    "transformers>=5.9,<5.15",
    "datasets>=4.2,<5",
    "accelerate>=1.14,<2",
    "peft>=0.20,<0.21",
]
trl = [
    "trl>=1.10,<2",
    "bitsandbytes>=0.50,<0.51",
    "forgekit[hf]",
]
torchtune = ["torchtune>=0.6,<0.7"]
# NOTE: there is deliberately no `unsloth` or `vllm` extra, and no `all`.
#
# Both are supported by their plugins — `backend: unsloth` and the vllm
# exporter work whenever the package is importable — but neither can share a
# resolution with the mainstream stack:
#
#   unsloth  caps transformers<=5.5, datasets<4.4, trl<=0.24
#   vllm     pins compressed-tensors==0.17.0 and protobuf<7, against
#            llm-compressor's ==0.18.0 and gptqmodel's protobuf>=7.34
#
# Declaring them as conflicting extras is expressible but makes `uv lock`
# fork combinatorially. They belong in their own environments instead:
#
#   uv venv .venv-unsloth && uv pip install --python .venv-unsloth 'unsloth>=2026.8' -e .
#   uv venv .venv-serve   && uv pip install --python .venv-serve   'vllm>=0.27'
#
# See docs/compression_landscape.md for the full dependency findings.
# Not published to PyPI. Install from source:
#   uv pip install 'onecompression @ git+https://github.com/FujitsuResearch/OneCompression'
onecompression = ["forgekit[hf]"]
# gptqmodel replaces auto-gptq, archived 2025-04-11 and dropped by transformers.
gptq = ["gptqmodel>=7.3,<8", "forgekit[hf]"]
# llmcompressor replaces autoawq, deprecated and adopted by the vLLM project.
awq = ["llmcompressor>=0.13,<0.13.1", "forgekit[hf]"]
# AutoRound: signed-gradient rounding search. Best accuracy below 4 bits, and
# the only backend here that can emit every downstream format.
autoround = ["auto-round>=0.14,<0.15", "forgekit[hf]"]
hqq = ["hqq>=0.2.8,<0.3", "forgekit[hf]"]
bnb = ["bitsandbytes>=0.50,<0.51", "forgekit[hf]"]
aqlm = ["aqlm>=1.1,<1.2", "forgekit[hf]"]
doc2lora = ["forgekit[hf]"]
lm-eval = ["lm-eval>=0.4.12,<0.5", "forgekit[hf]"]
gguf = ["gguf>=0.19,<0.20", "llama-cpp-python>=0.3.35,<0.4"]
mlx = ["mlx-lm>=0.31,<0.32"]
i-dlm = ["forgekit[hf]"]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "types-PyYAML",
]

[tool.uv]
# Resolve only for platforms forgekit actually supports. Without this uv also
# forks the resolution for win32 — where bitsandbytes, vllm, and unsloth have no
# wheels anyway — which roughly triples resolution time for no benefit.
#
#   linux/aarch64 — GB10 (Grace ARM), the primary target
#   linux/x86_64  — consumer and datacenter GPUs
#   darwin        — Apple Silicon, for the mlx exporter
environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/LITl-l/forgekit"
Issues = "https://github.com/LITl-l/forgekit/issues"

[project.entry-points."forgekit.trainers"]
qlora = "forgekit.plugins.trainers.qlora:QLoRATrainer"
sft = "forgekit.plugins.trainers.sft:SFTTrainer"
dpo = "forgekit.plugins.trainers.dpo:DPOTrainer"
grpo = "forgekit.plugins.trainers.grpo:GRPOTrainer"
full_finetune = "forgekit.plugins.trainers.full_finetune:FullFinetuneTrainer"
qat = "forgekit.plugins.trainers.qat:QATTrainer"
doc2lora = "forgekit.plugins.trainers.doc2lora:Doc2LoRATrainer"
i_dlm = "forgekit.plugins.trainers.i_dlm:IDLMTrainer"

[project.entry-points."forgekit.compressors"]
onecompression = "forgekit.plugins.compressors.onecompression:OneCompressionCompressor"
gptq = "forgekit.plugins.compressors.gptq:GPTQCompressor"
autoround = "forgekit.plugins.compressors.autoround:AutoRoundCompressor"
awq = "forgekit.plugins.compressors.awq:AWQCompressor"
hqq = "forgekit.plugins.compressors.hqq:HQQCompressor"
bnb = "forgekit.plugins.compressors.bnb:BnBCompressor"
aqlm = "forgekit.plugins.compressors.aqlm:AQLMCompressor"

[project.entry-points."forgekit.evaluators"]
lm_eval_harness = "forgekit.plugins.evaluators.lm_eval_harness:LMEvalHarnessEvaluator"
perplexity = "forgekit.plugins.evaluators.perplexity:PerplexityEvaluator"

[project.entry-points."forgekit.exporters"]
gguf = "forgekit.plugins.exporters.gguf:GGUFExporter"
vllm = "forgekit.plugins.exporters.vllm:VLLMExporter"
mlx = "forgekit.plugins.exporters.mlx:MLXExporter"
i_dlm_isd = "forgekit.plugins.exporters.i_dlm_isd:IDLMISDExporter"

[tool.hatch.build.targets.wheel]
packages = ["forgekit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # allow en-dash / × / ≤ in prose docstrings

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Smoke tests are deselected by default: they need the ML extras and pull a
# small model from HuggingFace. `just smoke` (or `-m smoke`) opts back in.
addopts = "-ra -m 'not smoke'"
markers = [
    "smoke: end-to-end test that really executes a pipeline stage (needs ML extras + network)",
]
