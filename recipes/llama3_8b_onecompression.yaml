name: llama3-8b-onecompression
model: meta-llama/Meta-Llama-3-8B

data:
  kind: hf_dataset
  config:
    path: allenai/c4
    name: en
    split: train
    streaming: true
    num_calibration: 1024

trainer:
  kind: qlora
  config:
    backend: auto  # unsloth if importable, else trl
    dataset:
      path: allenai/c4
      name: en
      text_column: text
      max_samples: 20000
    lr: 1.0e-4
    steps: 500
    seq_len: 4096
    lora_r: 32

compressors:
  - kind: onecompression
    config:
      # AutoBit assigns per-layer bit-widths under a memory budget.
      mode: autobit
      target_avg_bits: 3.5
      calibration:
        num_samples: 128

evaluator:
  kind: lm_eval_harness
  config:
    tasks: [hellaswag, arc_easy, mmlu]
    batch_size: 8

exporter:
  kind: vllm
  config:
    dtype: auto
    quantization: auto
    gpu_memory_utilization: 0.9
