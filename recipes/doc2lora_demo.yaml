name: doc2lora-demo
model: mistralai/Mistral-7B-v0.3

data:
  kind: local_text
  config:
    path: ./example_docs/
    glob: "*.md"

trainer:
  kind: doc2lora
  config:
    documents: ["./example_docs/"]
    hypernetwork_checkpoint: SakanaAI/doc-to-lora
    lora_r: 8
    lora_alpha: 16

evaluator:
  kind: perplexity
  config:
    dataset: wikitext2

exporter:
  kind: gguf
  config:
    quant: q5_k_m
